<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./estilos/index.css">
</head>
<body>

    <label id="lblId" class="lbl">Faça seu login</label>
    <input id="inptNome" class="inpt" type="text" placeholder="Digite seu nome">
    <input id="inptSenha" class="inpt" type="password" placeholder="Digite sua senha">
    <input id="inptEmail" class="inpt" type="email" placeholder="Digite seu email">
    <input id="inptIdade" class="inpt" type="number" placeholder="Digite sua idade">
    <input id="inptTelefone" class="inpt" type="text" placeholder="Digite seu telefone">
    <button id="btnEnviar" class="btn">Enviar</button>

    <label id="lblDados" class="lbl">Dados salvos</label>
    <p id="dadosSalvos">carregando...</p>
    <script src="./codigos/index.js" defer></script>
</body>
</html>
