<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Prática - Meu primeiro JavaScript</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <h1>Atividade Prática</h1>

    <input id="inptValor1" class="inpt" type="number" placeholder="Digite o valor 1">
    <input id="inptValor2" class="inpt" type="number" placeholder="Digite o valor 2">

    <button id="btnMaior" class="btn">Qual é o maior?</button>
    <label id="lblResultado" class="lbl">Resultado aparece aqui</label>

    <hr>

    <div class="calculadora">
        <button id="btnSomar" class="btn">Somar (+)</button>
        <button id="btnSubtrair" class="btn">Subtrair (-)</button>
        <button id="btnMultiplicar" class="btn">Multiplicar (x)</button>
        <button id="btnDividir" class="btn">Dividir (÷)</button>
    </div>

    <hr>

    <button id="btnLimpar" class="btn btnLimpar">Limpar campos</button>

    <script src="./index.js" defer></script>
</body>
</html>
